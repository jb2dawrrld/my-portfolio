    <meta name="theme-color" content="#c4eea5" />
    <script>
      (function () {
        var theme = localStorage.getItem("portfolio-theme") === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#121c16" : "#c4eea5");
      })();
    </script>
